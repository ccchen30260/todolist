<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日夜班工作任務清單</title>
    <style>
        :root {
            /* 日班主題 - 暖色 */
            --primary: #f59e0b;
            --primary-light: #fbbf24;
            --primary-dark: #d97706;
            --bg: #fffbeb;
            --bg-secondary: #fef3c7;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --progress-start: #ef4444;
            --progress-mid: #f59e0b;
            --progress-end: #22c55e;
            --shadow: 0 4px 20px rgba(245, 158, 11, 0.15);
            --badge-daily: #ef4444;
            --badge-daily-bg: #fef2f2;
            --checkbox-checked: #22c55e;
            --btn-edit: #3b82f6;
            --btn-delete: #ef4444;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-shift="night"] {
            /* 夜班主題 - 冷色 */
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --bg: #eef2ff;
            --bg-secondary: #e0e7ff;
            --card-bg: #ffffff;
            --text: #1e1b4b;
            --text-secondary: #6b7280;
            --border: #ddd6fe;
            --progress-start: #ef4444;
            --progress-mid: #6366f1;
            --progress-end: #22c55e;
            --shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
            --badge-daily: #ef4444;
            --badge-daily-bg: #fef2f2;
            --checkbox-checked: #22c55e;
            --btn-edit: #3b82f6;
            --btn-delete: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px 16px 100px;
        }

        /* 頂部標題 */
        .header {
            text-align: center;
            padding: 20px 0 12px;
            position: relative;
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .date-display {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 500;
        }
        .header .date-display .dotw {
            color: var(--primary);
            font-weight: 700;
        }

        /* 班別切換 */
        .shift-toggle {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0 20px;
        }
        .shift-btn {
            flex: 1;
            max-width: 180px;
            padding: 14px 20px;
            border: 2px solid var(--border);
            border-radius: 16px;
            background: var(--card-bg);
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-secondary);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .shift-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .shift-btn.active-day {
            border-color: #f59e0b;
            background: #fffbeb;
            color: #d97706;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.25);
        }
        .shift-btn.active-night {
            border-color: #6366f1;
            background: #eef2ff;
            color: #4f46e5;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.25);
        }
        .shift-btn .icon {
            font-size: 1.4rem;
        }

        /* 進度條卡片 */
        .progress-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .progress-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .progress-percent {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            transition: color 0.3s;
        }
        .progress-percent.complete {
            color: var(--progress-end);
        }
        .progress-bar-track {
            width: 100%;
            height: 16px;
            background: #f1f1f1;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--progress-start), var(--progress-mid), var(--progress-end));
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-width: 0;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, transparent 50%, rgba(0, 0, 0, 0.05) 100%);
            border-radius: 10px;
        }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .progress-stats .done-count {
            color: var(--progress-end);
            font-weight: 700;
        }
        .progress-stats .total-count {
            font-weight: 700;
        }

        /* 任務列表 */
        .task-list-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all var(--transition);
        }
        .task-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            transition: background var(--transition);
        }
        .task-list-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .task-count-badge {
            background: var(--primary);
            color: #fff;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .task-list {
            list-style: none;
            max-height: 420px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .task-list::-webkit-scrollbar {
            width: 6px;
        }
        .task-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .task-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.2s, transform 0.2s;
            cursor: default;
            animation: slideIn 0.3s ease-out;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-item:hover {
            background: #fafafa;
        }
        .task-item.completed-task {
            opacity: 0.7;
        }
        .task-item.completed-task .task-name {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-checkbox {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2.5px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            background: #fff;
            position: relative;
            -webkit-appearance: none;
            appearance: none;
        }
        .task-checkbox:hover {
            border-color: var(--primary);
            transform: scale(1.1);
        }
        .task-checkbox:checked {
            background: var(--checkbox-checked);
            border-color: var(--checkbox-checked);
            animation: popCheck 0.3s ease;
        }
        .task-checkbox:checked::after {
            content: '✓';
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }

        @keyframes popCheck {
            0% {
                transform: scale(0.8);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        .task-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .task-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .task-name {
            font-size: 1rem;
            font-weight: 600;
            word-break: break-word;
            transition: color 0.2s;
        }
        .task-shift-tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--bg-secondary);
            color: var(--primary);
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .task-daily-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--badge-daily-bg);
            color: var(--badge-daily);
            white-space: nowrap;
            letter-spacing: 0.5px;
            border: 1px solid #fecaca;
        }
        .task-daily-badge .star {
            margin-right: 2px;
        }

        .task-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.25s;
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-icon:hover {
            transform: scale(1.12);
        }
        .btn-icon.edit-btn:hover {
            background: #eff6ff;
            color: var(--btn-edit);
        }
        .btn-icon.delete-btn:hover {
            background: #fef2f2;
            color: var(--btn-delete);
        }

        /* 空狀態 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        .empty-state p {
            font-size: 0.95rem;
        }

        /* 底部新增按鈕 */
        .add-task-btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 36px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            z-index: 50;
        }
        .add-task-btn:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
        }
        .add-task-btn:active {
            transform: translateX(-50%) translateY(0);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        /* 彈窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid var(--border);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
            background: #fff;
            color: var(--text);
            outline: none;
        }
        .form-group input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .shift-radio-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .shift-radio {
            flex: 1;
            min-width: 70px;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            user-select: none;
            background: #fff;
            color: var(--text-secondary);
        }
        .shift-radio:hover {
            border-color: var(--primary-light);
        }
        .shift-radio.selected-day {
            border-color: #f59e0b;
            background: #fffbeb;
            color: #d97706;
        }
        .shift-radio.selected-night {
            border-color: #6366f1;
            background: #eef2ff;
            color: #4f46e5;
        }
        .shift-radio.selected-both {
            border-color: #8b5cf6;
            background: #f5f3ff;
            color: #7c3aed;
        }
        .daily-checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 0;
        }
        .daily-checkbox-group input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--primary);
            border-radius: 6px;
        }
        .daily-checkbox-group label {
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0;
        }
        .daily-checkbox-group .daily-hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .modal-actions button {
            flex: 1;
            padding: 13px;
            border-radius: 14px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-cancel {
            background: #f1f1f1;
            color: var(--text-secondary);
        }
        .btn-cancel:hover {
            background: #e5e5e5;
        }
        .btn-save {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
        }
        .btn-save:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-save:active {
            transform: translateY(0);
        }

        /* 刪除確認彈窗 */
        .confirm-text {
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .confirm-task-name {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 20px;
            word-break: break-word;
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        /* Toast 通知 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--text);
            color: var(--card-bg);
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #16a34a;
            color: #fff;
        }
        .toast.error {
            background: #dc2626;
            color: #fff;
        }

        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 響應式 */
        @media (max-width: 480px) {
            .container {
                padding: 8px 10px 90px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .shift-btn {
                padding: 10px 14px;
                font-size: 0.9rem;
                border-radius: 12px;
            }
            .progress-card {
                padding: 14px 16px;
                border-radius: 16px;
            }
            .task-item {
                padding: 12px 14px;
                gap: 10px;
            }
            .task-list-header {
                padding: 12px 14px;
            }
            .task-name {
                font-size: 0.9rem;
            }
            .add-task-btn {
                padding: 14px 24px;
                font-size: 0.95rem;
                bottom: 16px;
            }
            .modal {
                padding: 20px 16px;
                border-radius: 18px;
            }
            .btn-icon {
                width: 30px;
                height: 30px;
                font-size: 0.85rem;
            }
        }
        @media (max-width: 360px) {
            .shift-btn {
                font-size: 0.8rem;
                padding: 8px 10px;
            }
            .task-item {
                flex-wrap: wrap;
            }
            .task-actions {
                margin-left: auto;
            }
        }
    </style>
</head>
<body data-shift="day">

    <!-- Toast 通知容器 -->
    <div id="toast" class="toast"></div>

    <div class="container">
        <!-- 頂部 -->
        <div class="header">
            <h1>📋 工作任務清單</h1>
            <div class="date-display" id="dateDisplay"></div>
        </div>

        <!-- 班別切換 -->
        <div class="shift-toggle">
            <button class="shift-btn active-day" id="btnDay" onclick="switchShift('day')">
                <span class="icon">☀️</span> 日班
            </button>
            <button class="shift-btn" id="btnNight" onclick="switchShift('night')">
                <span class="icon">🌙</span> 夜班
            </button>
        </div>

        <!-- 進度條卡片 -->
        <div class="progress-card">
            <div class="progress-header">
                <span class="progress-label" id="progressLabel">今日完成進度</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
            </div>
            <div class="progress-stats">
                <span>已完成：<span class="done-count" id="doneCount">0</span> 項</span>
                <span>總任務：<span class="total-count" id="totalCount">0</span> 項</span>
            </div>
        </div>

        <!-- 任務列表 -->
        <div class="task-list-container">
            <div class="task-list-header">
                <h2 id="taskListTitle">日班任務</h2>
                <span class="task-count-badge" id="taskCountBadge">0 項</span>
            </div>
            <ul class="task-list" id="taskList">
                <!-- 動態渲染 -->
            </ul>
        </div>
    </div>

    <!-- 新增任務按鈕 -->
    <button class="add-task-btn" onclick="openAddModal()">
        <span>＋</span> 新增任務
    </button>

    <!-- 新增/編輯任務彈窗 -->
    <div id="taskModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3 id="modalTitle">新增任務</h3>
            <div class="form-group">
                <label>任務名稱</label>
                <input type="text" id="taskNameInput" placeholder="輸入任務名稱..." maxlength="100">
            </div>
            <div class="form-group">
                <label>適用班別</label>
                <div class="shift-radio-group" id="shiftRadioGroup">
                    <div class="shift-radio selected-day" data-value="day" onclick="selectShiftRadio('day', this)">☀️ 日班</div>
                    <div class="shift-radio" data-value="night" onclick="selectShiftRadio('night', this)">🌙 夜班</div>
                    <div class="shift-radio" data-value="both" onclick="selectShiftRadio('both', this)">🔀 兩者</div>
                </div>
            </div>
            <div class="form-group">
                <div class="daily-checkbox-group" onclick="toggleDailyCheckbox()">
                    <input type="checkbox" id="dailyCheckbox">
                    <label for="dailyCheckbox">每日必做任務 <span class="daily-hint">（每天都要完成）</span></label>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" id="saveBtn" onclick="saveTask()">儲存</button>
            </div>
        </div>
    </div>

    <!-- 刪除確認彈窗 -->
    <div id="deleteModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>🗑️ 刪除任務</h3>
            <p class="confirm-text">確定要刪除以下任務嗎？</p>
            <p class="confirm-task-name" id="deleteTaskName"></p>
            <p class="confirm-text" style="font-size:0.85rem;">此操作無法復原</p>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeDeleteModal()">取消</button>
                <button class="btn-save btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">刪除</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ⚙️ 設定：請將下方 GAS_URL 替換為你的 Google Apps Script Web App URL
        // ============================================================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzwDar5EVO0F4hpqiOshMaLKT9GQ6ctZ-PGYj4BHYujlzS8lvyDu3KkfssT5OcgBRfLeA/exec'; // ← 請替換成你的 GAS 部署 URL

        // ============================================================
        // 全域狀態
        // ============================================================
        let currentShift = 'day'; // 'day' | 'night'
        let tasks = []; // 當前班別的所有任務
        let dailyStatus = {}; // { taskId: true/false } 今日完成狀態
        let editingTaskId = null; // 編輯中的任務 ID
        let deletingTaskId = null; // 刪除中的任務 ID
        let selectedShiftForModal = 'day'; // 彈窗中選擇的班別
        let isDailyForModal = false; // 彈窗中選擇的每日必做

        // ============================================================
        // 初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            updateDateDisplay();
            loadTasks();
        });

        // ============================================================
        // 日期顯示
        // ============================================================
        function updateDateDisplay() {
            const now = new Date();
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const w = weekdays[now.getDay()];
            const dateStr = `${y} 年 ${m} 月 ${d} 日`;
            document.getElementById('dateDisplay').innerHTML =
                `📅 ${dateStr} <span class="dotw">星期${w}</span>`;
        }

        // ============================================================
        // 班別切換
        // ============================================================
        function switchShift(shift) {
            currentShift = shift;
            document.body.setAttribute('data-shift', shift);

            // 更新按鈕樣式
            const btnDay = document.getElementById('btnDay');
            const btnNight = document.getElementById('btnNight');
            btnDay.className = 'shift-btn' + (shift === 'day' ? ' active-day' : '');
            btnNight.className = 'shift-btn' + (shift === 'night' ? ' active-night' : '');

            // 更新任務列表標題
            document.getElementById('taskListTitle').textContent =
                shift === 'day' ? '☀️ 日班任務' : '🌙 夜班任務';

            // 重新載入任務
            loadTasks();
        }

        // ============================================================
        // Toast 通知
        // ============================================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            // 強制重新觸發動畫
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // 載入任務
        // ============================================================
        async function loadTasks() {
            if (!GAS_URL || GAS_URL === 'YOUR_GAS_WEB_APP_URL_HERE') {
                showToast('⚠️ 請先設定 GAS_URL', 'error');
                renderEmptyState('請在程式碼中設定 GAS Web App URL');
                updateProgress();
                return;
            }

            try {
                const today = getTodayString();
                const shiftParam = currentShift;

                // 同時獲取任務列表和今日完成狀態
                const url = `${GAS_URL}?action=get_tasks&shift=${shiftParam}&date=${today}`;
                const response = await fetch(url, { method: 'GET' });
                if (!response.ok) throw new Error('網路回應失敗');
                const data = await response.json();

                if (data.success) {
                    tasks = data.tasks || [];
                    dailyStatus = {};
                    (data.dailyStatus || []).forEach(item => {
                        dailyStatus[item.task_id] = item.completed;
                    });
                    renderTaskList();
                    updateProgress();
                } else {
                    throw new Error(data.message || '載入失敗');
                }
            } catch (error) {
                console.error('載入任務失敗:', error);
                tasks = [];
                dailyStatus = {};
                renderEmptyState('無法載入任務，請確認 GAS 已部署且 URL 正確');
                updateProgress();
                showToast('❌ 載入失敗：' + error.message, 'error');
            }
        }

        function getTodayString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // ============================================================
        // 渲染任務列表
        // ============================================================
        function renderTaskList() {
            const list = document.getElementById('taskList');
            if (!tasks || tasks.length === 0) {
                renderEmptyState('目前沒有任務，點擊下方按鈕新增');
                return;
            }

            const sortedTasks = [...tasks].sort((a, b) => {
                // 未完成的排前面，已完成的排後面
                const aDone = dailyStatus[a.id] || false;
                const bDone = dailyStatus[b.id] || false;
                if (aDone !== bDone) return aDone ? 1 : -1;
                // 每日必做排前面
                if (a.is_daily !== b.is_daily) return a.is_daily ? -1 : 1;
                // 按名稱排序
                return a.name.localeCompare(b.name, 'zh-TW');
            });

            list.innerHTML = sortedTasks.map(task => {
                const completed = dailyStatus[task.id] || false;
                const shiftTag = getShiftTag(task.shift);
                const dailyBadge = task.is_daily ?
                    `<span class="task-daily-badge"><span class="star">⭐</span>每日必做</span>` : '';
                return `
                    <li class="task-item ${completed ? 'completed-task' : ''}" data-task-id="${task.id}">
                        <input type="checkbox" 
                               class="task-checkbox" 
                               ${completed ? 'checked' : ''} 
                               onchange="toggleTask(${task.id}, this.checked)"
                               aria-label="完成 ${task.name}">
                        <div class="task-info">
                            <div class="task-name-row">
                                <span class="task-name">${escapeHtml(task.name)}</span>
                                <span class="task-shift-tag">${shiftTag}</span>
                                ${dailyBadge}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="btn-icon edit-btn" onclick="openEditModal(${task.id})" title="編輯任務">✏️</button>
                            <button class="btn-icon delete-btn" onclick="openDeleteModal(${task.id})" title="刪除任務">🗑️</button>
                        </div>
                    </li>
                `;
            }).join('');

            // 更新任務計數
            document.getElementById('taskCountBadge').textContent = `${tasks.length} 項`;
        }

        function getShiftTag(shift) {
            switch (shift) {
                case 'day':
                    return '☀️ 日班';
                case 'night':
                    return '🌙 夜班';
                case 'both':
                    return '🔀 兩者';
                default:
                    return shift;
            }
        }

        function renderEmptyState(message) {
            const list = document.getElementById('taskList');
            list.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <p>${message}</p>
                </div>
            `;
            document.getElementById('taskCountBadge').textContent = '0 項';
            tasks = [];
            dailyStatus = {};
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        // 更新進度條
        // ============================================================
        function updateProgress() {
            const total = tasks.length;
            const done = tasks.filter(t => dailyStatus[t.id] || false).length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            const percentEl = document.getElementById('progressPercent');
            const barEl = document.getElementById('progressBarFill');
            const doneEl = document.getElementById('doneCount');
            const totalEl = document.getElementById('totalCount');

            percentEl.textContent = `${percent}%`;
            percentEl.className = 'progress-percent' + (percent === 100 && total > 0 ? ' complete' : '');
            barEl.style.width = `${percent}%`;
            doneEl.textContent = done;
            totalEl.textContent = total;

            // 更新進度標籤
            const labelEl = document.getElementById('progressLabel');
            if (total === 0) {
                labelEl.textContent = '尚無任務';
            } else if (percent === 100) {
                labelEl.textContent = '🎉 全部完成！';
            } else {
                labelEl.textContent = '今日完成進度';
            }
        }

        // ============================================================
        // 切換任務完成狀態
        // ============================================================
        async function toggleTask(taskId, completed) {
            try {
                const today = getTodayString();
                const body = JSON.stringify({
                    action: 'toggle_task',
                    task_id: taskId,
                    date: today,
                    shift: currentShift,
                    completed: completed
                });

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: body
                });
                const data = await response.json();

                if (data.success) {
                    dailyStatus[taskId] = completed;
                    renderTaskList();
                    updateProgress();
                    if (completed) {
                        showToast('✅ 任務完成！');
                    } else {
                        showToast('↩️ 已取消完成');
                    }
                } else {
                    throw new Error(data.message || '操作失敗');
                }
            } catch (error) {
                console.error('切換任務失敗:', error);
                showToast('❌ ' + error.message, 'error');
                // 重新載入以恢復狀態
                loadTasks();
            }
        }

        // ============================================================
        // 新增任務 - 彈窗
        // ============================================================
        function openAddModal() {
            editingTaskId = null;
            selectedShiftForModal = currentShift === 'day' ? 'day' : 'night';
            isDailyForModal = false;
            document.getElementById('modalTitle').textContent = '➕ 新增任務';
            document.getElementById('taskNameInput').value = '';
            document.getElementById('dailyCheckbox').checked = false;
            updateShiftRadioUI();
            document.getElementById('saveBtn').textContent = '新增';
            document.getElementById('taskModal').style.display = 'flex';
            document.getElementById('taskNameInput').focus();
        }

        function openEditModal(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            editingTaskId = taskId;
            selectedShiftForModal = task.shift || 'day';
            isDailyForModal = task.is_daily || false;
            document.getElementById('modalTitle').textContent = '✏️ 編輯任務';
            document.getElementById('taskNameInput').value = task.name;
            document.getElementById('dailyCheckbox').checked = isDailyForModal;
            updateShiftRadioUI();
            document.getElementById('saveBtn').textContent = '儲存變更';
            document.getElementById('taskModal').style.display = 'flex';
            document.getElementById('taskNameInput').focus();
        }

        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
            editingTaskId = null;
        }

        function selectShiftRadio(value, element) {
            selectedShiftForModal = value;
            const radios = document.querySelectorAll('.shift-radio');
            radios.forEach(r => {
                r.className = 'shift-radio';
                const v = r.getAttribute('data-value');
                if (v === value) {
                    if (value === 'day') r.classList.add('selected-day');
                    if (value === 'night') r.classList.add('selected-night');
                    if (value === 'both') r.classList.add('selected-both');
                }
            });
        }

        function updateShiftRadioUI() {
            const radios = document.querySelectorAll('.shift-radio');
            radios.forEach(r => {
                r.className = 'shift-radio';
                const v = r.getAttribute('data-value');
                if (v === selectedShiftForModal) {
                    if (v === 'day') r.classList.add('selected-day');
                    if (v === 'night') r.classList.add('selected-night');
                    if (v === 'both') r.classList.add('selected-both');
                }
            });
        }

        function toggleDailyCheckbox() {
            const checkbox = document.getElementById('dailyCheckbox');
            isDailyForModal = checkbox.checked;
        }

        // ============================================================
        // 儲存任務（新增或更新）
        // ============================================================
        async function saveTask() {
            const name = document.getElementById('taskNameInput').value.trim();
            if (!name) {
                showToast('⚠️ 請輸入任務名稱', 'error');
                document.getElementById('taskNameInput').focus();
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.textContent;
            saveBtn.innerHTML = '<span class="loading-spinner"></span>';
            saveBtn.disabled = true;

            try {
                const body = JSON.stringify({
                    action: editingTaskId ? 'update_task' : 'add_task',
                    task_id: editingTaskId,
                    name: name,
                    shift: selectedShiftForModal,
                    is_daily: isDailyForModal
                });

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: body
                });
                const data = await response.json();

                if (data.success) {
                    closeModal();
                    showToast(editingTaskId ? '✅ 任務已更新' : '✅ 任務已新增');
                    loadTasks();
                } else {
                    throw new Error(data.message || '儲存失敗');
                }
            } catch (error) {
                console.error('儲存任務失敗:', error);
                showToast('❌ ' + error.message, 'error');
            } finally {
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
            }
        }

        // ============================================================
        // 刪除任務
        // ============================================================
        function openDeleteModal(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            deletingTaskId = taskId;
            document.getElementById('deleteTaskName').textContent = `「${task.name}」`;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            deletingTaskId = null;
        }

        async function confirmDelete() {
            if (!deletingTaskId) return;
            const btn = document.getElementById('confirmDeleteBtn');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="loading-spinner"></span>';
            btn.disabled = true;

            try {
                const body = JSON.stringify({
                    action: 'delete_task',
                    task_id: deletingTaskId
                });

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: body
                });
                const data = await response.json();

                if (data.success) {
                    closeDeleteModal();
                    showToast('🗑️ 任務已刪除');
                    loadTasks();
                } else {
                    throw new Error(data.message || '刪除失敗');
                }
            } catch (error) {
                console.error('刪除任務失敗:', error);
                showToast('❌ ' + error.message, 'error');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // ============================================================
        // 鍵盤快捷鍵
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeDeleteModal();
            }
            if (e.key === 'Enter' && document.getElementById('taskModal').style.display === 'flex') {
                saveTask();
            }
        });

        // 點擊彈窗外部關閉
        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeDeleteModal();
        });
    </script>
</body>
</html>
